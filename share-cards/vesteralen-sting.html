<!DOCTYPE html>
<html lang="nb" aria-label="NextElite · hei fra vesterålen">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>hei fra vesterålen — sting</title>
<style>
  @font-face {
    font-family: 'Rektorat Heavy';
    src: url('../fonts/RektoratHeavy-Regular.woff2') format('woff2');
    font-weight: 800;
    font-style: normal;
    font-display: block;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #f1f0ed;
  }

  .card {
    position: relative;
    width: 1080px;
    height: 1920px;
    background: #f1f0ed;
    overflow: hidden;
  }

  .watermark {
    position: absolute;
    bottom: 120px;
    left: -12px;
    font-family: 'Rektorat Heavy', -apple-system, sans-serif;
    font-size: 210px;
    font-weight: 800;
    letter-spacing: -12px;
    color: rgba(0, 0, 0, 0.045);
    text-transform: lowercase;
    line-height: 1;
    white-space: nowrap;
    opacity: 0;
  }

  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 0 72px 160px;
  }

  .title {
    font-family: 'Rektorat Heavy', -apple-system, sans-serif;
    font-size: 156px;
    font-weight: 800;
    letter-spacing: -7px;
    color: #67645e;
    text-transform: lowercase;
    line-height: 0.86;
  }

  .line {
    display: block;
    opacity: 0;
  }

  .xx-mark {
    position: absolute;
    bottom: 16px;
    right: 16px;
    font-size: 7px;
    font-weight: 900;
    color: rgba(0, 0, 0, 0.07);
    letter-spacing: 3px;
  }
</style>
</head>
<body>
<div class="card" role="img" aria-label="NextElite · hei fra vesterålen">
  <div class="watermark" id="mark">nextelite</div>
  <div class="content">
    <div class="title"><span class="line" id="l1">hei fra</span><span class="line" id="l2">vesterålen</span></div>
  </div>
  <div class="xx-mark">XX</div>
</div>
<script>
(function () {
  var ease = 'cubic-bezier(0.16, 1, 0.3, 1)';
  var mark = document.getElementById('mark');
  var l1 = document.getElementById('l1');
  var l2 = document.getElementById('l2');
  mark.animate(
    [{ opacity: 0, transform: 'translateY(18px)' }, { opacity: 1, transform: 'none' }],
    { duration: 1400, delay: 200, easing: ease, fill: 'both' }
  );
  l1.animate(
    [{ opacity: 0, transform: 'translateY(36px)' }, { opacity: 1, transform: 'none' }],
    { duration: 1100, delay: 1100, easing: ease, fill: 'both' }
  );
  l2.animate(
    [{ opacity: 0, transform: 'translateY(36px)' }, { opacity: 1, transform: 'none' }],
    { duration: 1100, delay: 1500, easing: ease, fill: 'both' }
  );
  window.seek = function (ms) {
    document.getAnimations().forEach(function (anim) {
      anim.pause();
      anim.currentTime = ms;
    });
  };
})();
</script>
</body>
</html>
